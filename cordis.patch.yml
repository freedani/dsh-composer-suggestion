# Composer suggestions: after a turn ends the Host streams a few follow-up
# candidates; the Client renders the current one as ghost text and accepts it on
# Tab (Alt+Down cycles candidates). Shipped under its own package id, so it can
# sit beside the upstream dsh-composer-predictions bundle.
- insert:
    - id: composer-suggestion
      name: dsh-composer-suggestion
      config:
        maxOutputTokens: 220
        timeoutMs: 20000
        maxMessages: 10
        maxChars: 8000
        maxSuggestions: 3
        maxToolNotes: 6
        # Optional fixed route for suggestions; both or neither. Without a pair
        # the Session's own provider/model is used at its lowest reasoning effort.
        # provider: deepseek-account
        # model: deepseek-flash
        # reasoningEffort: off
